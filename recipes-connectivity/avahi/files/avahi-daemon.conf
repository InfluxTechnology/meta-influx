[server]
use-ipv4=yes
use-ipv6=no

# Only advertise on wlan0 (STA)
allow-interfaces=wlan0
deny-interfaces=wlan1,ppp0

# Optional: avoid rename conflicts if the name already exists on the LAN
# Avahi will auto-rename by default (e.g. serial-2.local) if conflict happens.
# host-name= is not needed because hostname already equals serial.

[publish]
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-domain=yes

[reflector]
enable-reflector=no
