<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modules</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 17px; margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(180deg, #f2fbfa 0%, #dff2ef 100%); }
        a { color: #20b2aa; }
        a:hover { color: #5ed8d1; }
        .top-switch a:hover, .section-links a:hover { color: #5ed8d1; }
        .container { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 780px; width: 94%; }
        .header { display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
        .title { font-size: 1.1em; font-weight: 600; color: #333; text-align: center; width: 100%; }
        .top-switch { display: flex; background: #f5f5f7; border-radius: 16px 16px 0 0; overflow: hidden; margin: -20px -20px 12px -20px; }
        .top-switch a { flex: 1; height: 64px; text-decoration: none; color: #20b2aa; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        .top-switch a.active { background: #fff; color: #178a83; }
        .top-switch svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .top-switch .tab-label { font-size: 0.62em; font-weight: 600; line-height: 1; white-space: nowrap; text-align: center; }
        .card { margin-top: 10px; overflow: hidden; }
        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 15px; background: #f5f5f7; }
        .section-label { font-size: 0.75em; color: #86868b; text-transform: uppercase; letter-spacing: 0.5px; line-height: 1; }
        .card-body { padding: 12px; }
        .module-list { display: grid; gap: 8px; }
        .module-item {
            display: grid;
            grid-template-columns: 180px 1fr;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border: 1px solid #d8dde2;
            border-radius: 8px;
            background: #fff;
            text-decoration: none;
            color: #1f2937;
        }
        .module-item:hover { border-color: #20b2aa; background: #f8fffe; }
        .module-name { font-weight: 700; color: #1f2937; }
        .module-path { color: #6b7280; font-size: 0.9em; }
        .empty { color: #6b7280; font-size: 0.9em; }
    </style>
    <style>body { padding-bottom: 64px !important; } .container { margin-top: 36px; }</style>
</head>
<body>
    {% include '_logout.html' %}
    <div class="container">
        {% include '_topnav.html' %}
        <div class="header">
            <span class="title">Modules</span>
        </div>
        <div class="card">
            <div class="section-header">
                <span class="section-label">Available Modules</span>
            </div>
            <div class="card-body">
                <div style="margin-bottom:10px;color:#6b7280;font-size:0.88em;">Hidden tab unlocked via version clicks.</div>
                <div class="module-list">
                    {% if modules %}
                        {% for m in modules %}
                        <a class="module-item" href="{{ m.path }}">
                            <span class="module-name">{{ m.name }}</span>
                            <span class="module-path">{{ m.path }}</span>
                        </a>
                        {% endfor %}
                    {% else %}
                        <div class="empty">No optional modules detected.</div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
    {% include '_footer.html' %}
</body>
</html>
