<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 17px; margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(180deg, #f2fbfa 0%, #dff2ef 100%); }
        a { color: #20b2aa; text-decoration: none; }
        a:hover { color: #5ed8d1; }
        .container { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 640px; width: 94%; }
        .top-switch { display: flex; background: #f5f5f7; border-radius: 16px 16px 0 0; overflow: hidden; margin: -20px -20px 12px -20px; }
        .top-switch a { flex: 1; height: 64px; text-decoration: none; color: #20b2aa; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        .top-switch a.active { background: #fff; color: #178a83; }
        .top-switch svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .top-switch .tab-label { font-size: 0.62em; font-weight: 600; line-height: 1; white-space: nowrap; text-align: center; }
        .detail-header { display: flex; align-items: center; margin-bottom: 14px; }
        .back-btn { font-size: 1.3em; color: #20b2aa; text-decoration: none; margin-right: 10px; line-height: 1; }
        .detail-title { font-size: 1.05em; font-weight: 600; color: #333; flex: 1; text-align: center; margin-right: 18px; }
        .detail-subtitle { margin: -8px 0 10px 0; text-align: center; color: #86868b; font-size: 0.85em; }
        .nav-bar { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; font-size: 0.8em; }
        .nav-bar a { color: #20b2aa; text-decoration: none; cursor: pointer; }
        .summary { margin-bottom: 14px; padding: 12px 14px; background: #f8fafa; border-radius: 10px; }
        .summary-main { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
        .summary-pct { font-size: 1.6em; font-weight: 700; color: #178a83; min-width: 62px; text-align: center; }
        .summary-bar-wrap { flex: 1; }
        .summary-label { font-size: 0.72em; color: #86868b; margin-bottom: 4px; }
        .summary-bar { height: 8px; background: #e5efed; border-radius: 4px; overflow: hidden; }
        .summary-bar-fill { height: 100%; background: #20b2aa; border-radius: 4px; transition: width 0.4s; }
        .summary-stats { font-size: 0.78em; }
        .stat-row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #eef3f2; }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: #86868b; }
        .stat-val { color: #333; font-weight: 500; }
        .stat-val.green { color: #2e7d32; }
        .stat-val.red { color: #c62828; }
        .filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 0 10px 0; }
        .filter-btn { border: 1px solid #cde3e1; border-radius: 999px; padding: 4px 10px; font-size: 0.74em; color: #178a83; background: #fff; cursor: pointer; }
        .filter-btn:hover { border-color: #20b2aa; color: #20b2aa; }
        .filter-btn.active { background: #e8f6f4; border-color: #20b2aa; color: #12726c; font-weight: 600; }
        .filter-btn .cnt { font-weight: 400; color: #86868b; margin-left: 2px; }
        .services-list { font-size: 0.86em; color: #333; }
        .svc-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid #ececef; }
        .svc-row:last-child { border-bottom: none; }
        .svc-name { color: #20b2aa; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; text-decoration: none; cursor: pointer; overflow: hidden; text-overflow: ellipsis; }
        .svc-active { min-width: 64px; text-align: right; }
        .svc-enabled { min-width: 64px; text-align: right; color: #86868b; }
        .svc-active.active { color: #2e7d32; }
        .svc-active.failed, .svc-active.inactive { color: #c62828; }
        .svc-empty { color: #86868b; text-align: center; padding: 10px 0; font-size: 0.86em; }
        .svc-count { color: #86868b; font-size: 0.8em; padding: 0 0 6px 0; }
    </style>
    <!-- footer-safe-space -->
    <style>body { padding-bottom: 64px !important; } .container { margin-top: 36px; }</style>
</head>
<body>
    {% include '_logout.html' %}
    <div class="container">
        {% include '_topnav.html' %}
        <div class="detail-header">
            <a class="back-btn" href="/device-info">&larr;</a>
            <span class="detail-title">Device information</span>
        </div>
        <div class="detail-subtitle" id="subtitle">Services</div>
        <div class="nav-bar"><a onclick="reloadServices()">Refresh</a></div>
        <div id="summaryBox" class="summary">
            <div class="summary-main">
                <div class="summary-pct" id="sumPct">--</div>
                <div class="summary-bar-wrap">
                    <div class="summary-label" id="sumLabel">Active Services</div>
                    <div class="summary-bar"><div class="summary-bar-fill" id="sumBar" style="width:0%"></div></div>
                </div>
            </div>
            <div class="summary-stats">
                <div class="stat-row"><span class="stat-label">Active</span><span class="stat-val green" id="sumActive">--</span></div>
                <div class="stat-row"><span class="stat-label">Inactive</span><span class="stat-val" id="sumInactive">--</span></div>
                <div class="stat-row"><span class="stat-label">Failed</span><span class="stat-val red" id="sumFailed">--</span></div>
                <div class="stat-row"><span class="stat-label">Total</span><span class="stat-val" id="sumTotal">--</span></div>
            </div>
        </div>
        <div id="filtersBar" class="filters"></div>
        <div id="servicesList" class="services-list"><div class="svc-empty">Loading...</div></div>
    </div>
    <script>
        var allServices = [];
        var summary = {};
        var activeFilter = 'active';

        function esc(v) {
            return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function num(v) { return (typeof v === 'number' && isFinite(v)) ? v : 0; }

        function classifyState(state) {
            var s = (state || '').trim().toLowerCase();
            if (s === 'active' || s === 'inactive' || s === 'failed' || s === 'activating' || s === 'deactivating') return s;
            if (s === 'unknown' || s === 'not-found') return 'unknown';
            return 'other';
        }

        function buildSummary() {
            summary = { total: allServices.length, active: 0, inactive: 0, failed: 0, activating: 0, deactivating: 0, unknown: 0, other: 0 };
            allServices.forEach(function(svc) { summary[classifyState(svc.active)]++; });
        }

        function renderSummary() {
            var total = num(summary.total);
            var active = num(summary.active);
            var pct = total > 0 ? Math.round(active / total * 100) : 0;
            document.getElementById('sumPct').textContent = pct + '%';
            document.getElementById('sumLabel').textContent = active + ' of ' + total + ' active';
            document.getElementById('sumBar').style.width = pct + '%';
            document.getElementById('sumActive').textContent = active;
            document.getElementById('sumInactive').textContent = num(summary.inactive);
            document.getElementById('sumFailed').textContent = num(summary.failed);
            document.getElementById('sumTotal').textContent = total;
        }

        function renderFilters() {
            var filters = [
                ['all', 'All'],
                ['active', 'Active'],
                ['inactive', 'Inactive'],
                ['failed', 'Failed']
            ];
            if (num(summary.activating)) filters.push(['activating', 'Activating']);
            if (num(summary.deactivating)) filters.push(['deactivating', 'Deactivating']);
            if (num(summary.unknown)) filters.push(['unknown', 'Unknown']);
            if (num(summary.other)) filters.push(['other', 'Other']);

            var html = '';
            filters.forEach(function(f) {
                var key = f[0], label = f[1];
                var count = key === 'all' ? num(summary.total) : num(summary[key]);
                var cls = 'filter-btn' + (key === activeFilter ? ' active' : '');
                html += '<a class="' + cls + '" onclick="setFilter(\'' + key + '\')">' + label + ' <span class="cnt">' + count + '</span></a>';
            });
            document.getElementById('filtersBar').innerHTML = html;
        }

        function renderServices() {
            var filtered;
            if (activeFilter === 'all') {
                filtered = allServices;
            } else {
                filtered = allServices.filter(function(svc) { return classifyState(svc.active) === activeFilter; });
            }
            var root = document.getElementById('servicesList');
            if (!filtered.length) {
                root.innerHTML = '<div class="svc-empty">No ' + activeFilter + ' services</div>';
                return;
            }
            var html = '<div class="svc-count">' + filtered.length + ' of ' + allServices.length + ' services</div>';
            filtered.forEach(function(svc) {
                var unit = String(svc.unit || '');
                var active = String(svc.active || 'unknown');
                var enabled = String(svc.enabled || 'unknown');
                html += '<div class="svc-row">' +
                    '<a class="svc-name" href="/service-info?unit=' + encodeURIComponent(unit) + '">' + esc(unit) + '</a>' +
                    '<div class="svc-active ' + esc(active) + '">' + esc(active) + '</div>' +
                    '<div class="svc-enabled">' + esc(enabled) + '</div>' +
                '</div>';
            });
            root.innerHTML = html;
        }

        function setFilter(name) {
            activeFilter = name;
            renderFilters();
            renderServices();
        }

        function reloadServices() {
            document.getElementById('servicesList').innerHTML = '<div class="svc-empty">Loading...</div>';
            fetch('/api/system-services?force=1&status=all')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    allServices = data.services || [];
                    buildSummary();
                    renderSummary();
                    renderFilters();
                    renderServices();
                })
                .catch(function() {
                    document.getElementById('servicesList').innerHTML = '<div class="svc-empty">Failed to load</div>';
                });
        }

        reloadServices();
    </script>
    {% include '_footer.html' %}
</body>
</html>
