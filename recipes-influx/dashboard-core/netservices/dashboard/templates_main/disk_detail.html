<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disk Usage</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 17px; margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(180deg, #f2fbfa 0%, #dff2ef 100%); }
        a { color: #20b2aa; cursor: pointer; text-decoration: none; } a:hover { color: #5ed8d1; }
        .container { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 640px; width: 94%; }
        .top-switch { display: flex; background: #f5f5f7; border-radius: 16px 16px 0 0; overflow: hidden; margin: -20px -20px 12px -20px; }
        .top-switch a { flex: 1; height: 64px; text-decoration: none; color: #20b2aa; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        .top-switch a.active { background: #fff; color: #178a83; }
        .top-switch svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .top-switch .tab-label { font-size: 0.62em; font-weight: 600; line-height: 1; white-space: nowrap; text-align: center; }
        .detail-header { display: flex; align-items: center; margin-bottom: 14px; }
        .back-btn { font-size: 1.25em; margin-right: 10px; text-decoration: none; line-height: 1; }
        .detail-title { font-size: 1.05em; font-weight: 600; color: #333; flex: 1; text-align: center; margin-right: 18px; }
        .detail-subtitle { margin: -8px 0 10px 0; text-align: center; color: #86868b; font-size: 0.85em; }
        .nav-bar { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; font-size: 0.8em; }
        .nav-bar a { color: #20b2aa; text-decoration: none; cursor: pointer; }
        .nav-bar a:active { opacity: 0.6; }
        .error { text-align: center; color: #c62828; padding: 10px; }
        .disk-list { font-size: 0.88em; }
        .disk-item { border-bottom: 1px solid #eef0f2; padding: 10px 0; }
        .disk-item:last-child { border-bottom: none; }
        .disk-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .disk-name { color: #333; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; margin-right: 8px; }
        .disk-pct { color: #178a83; font-weight: 600; white-space: nowrap; }
        .disk-bar { height: 6px; background: #e5efed; border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
        .disk-bar-fill { height: 100%; border-radius: 3px; }
        .disk-meta { font-size: 0.82em; color: #86868b; display: flex; flex-wrap: wrap; gap: 2px 12px; }
        @media (max-width: 500px) { .container { max-width: 420px; } }
    </style>
    <style>body { padding-bottom: 64px !important; } .container { margin-top: 36px; }</style>
</head>
<body>
    {% include '_logout.html' %}
    <div class="container">
    {% include '_topnav.html' %}
    <div class="detail-header"><a class="back-btn" href="/device-info">&larr;</a><span class="detail-title">Device Information</span></div>
    <div class="detail-subtitle">Disk Usage</div>
    <div class="nav-bar"><a onclick="loadData()">Refresh</a></div>
    <div id="error" class="error" style="display:none;"></div>
    <div id="content"></div>
    </div>
    <script>
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

    function diskBarColor(pct) {
        if (pct >= 90) return '#c62828';
        if (pct >= 70) return '#e6a23c';
        return '#20b2aa';
    }

    function renderDiskCards(rows) {
        var html = '<div class="disk-list">';
        rows.forEach(function(r) {
            var fs = r[0] || '--', size = r[1] || '--', used = r[2] || '--';
            var avail = r[3] || '--', usePct = r[4] || '0%', mount = r[5] || '--';
            var pctNum = parseFloat(usePct) || 0;
            html += '<div class="disk-item">';
            html += '<div class="disk-top"><span class="disk-name">' + esc(mount) + '</span>';
            html += '<span class="disk-pct">' + esc(usePct) + '</span></div>';
            html += '<div class="disk-bar"><div class="disk-bar-fill" style="width:' + Math.min(pctNum, 100) + '%;background:' + diskBarColor(pctNum) + '"></div></div>';
            html += '<div class="disk-meta">';
            html += '<span>' + esc(used) + ' / ' + esc(size) + '</span>';
            html += '<span>Free: ' + esc(avail) + '</span>';
            html += '<span>' + esc(fs) + '</span>';
            html += '</div></div>';
        });
        html += '</div>';
        return html;
    }

    function loadData() {
        var conEl = document.getElementById('content');
        document.getElementById('error').style.display = 'none';
        conEl.innerHTML = '';
        fetch('/api/device-status/details/disk')
            .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,data:d}; }); })
            .then(function(resp){
                if (!resp.ok) throw new Error(resp.data.error || 'Failed to load');
                var d = resp.data || {};
                var rows = Array.isArray(d.rows) ? d.rows : [];
                conEl.innerHTML = rows.length ? renderDiskCards(rows) : '<div style="color:#86868b;font-size:0.88em;padding:10px 0">No data</div>';
            })
            .catch(function(e){
                document.getElementById('error').textContent = e.message || 'Failed to load';
                document.getElementById('error').style.display = 'block';
            });
    }

    loadData();
    </script>
    {% include '_footer.html' %}
</body>
</html>
