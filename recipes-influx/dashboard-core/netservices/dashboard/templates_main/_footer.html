<style>
/* ── Dark mode ─────────────────────────────────────────────────────────── */
html.dark { color-scheme: dark; }
html.dark body { background: #121212 !important; color: #f0f0f0 !important; }
html.dark .container { background: #1e1e1e !important; box-shadow: 0 10px 40px rgba(0,0,0,0.8) !important; }
html.dark .top-switch { background: #2a2a2a !important; }
html.dark .top-switch a { color: #26c6c0 !important; }
html.dark .top-switch a.active { background: #1e1e1e !important; color: #26c6c0 !important; }
html.dark .section-header { background: #272727 !important; }
html.dark .section-label { color: #a0a0a0 !important; }
html.dark .section-link, html.dark .section-links a { color: #26c6c0 !important; }
html.dark .section-links .sep { color: #444 !important; }
html.dark .card { background: #1e1e1e !important; border-color: #383838 !important; }
html.dark .divider { background: #2e2e2e !important; }
html.dark .row label, html.dark .title, html.dark .detail-title,
html.dark .detail-signal .signal-text { color: #f0f0f0 !important; }
html.dark .detail-subtitle, html.dark .stat-label, html.dark .svc-enabled,
html.dark .connected-detail, html.dark .path { color: #b0b0b0 !important; }
html.dark .detail-table td:first-child { color: #a0a0a0 !important; }
html.dark .detail-table td:last-child, html.dark .stat-val { color: #f0f0f0 !important; }
html.dark .detail-table tr, html.dark .stat-row, html.dark .svc-row,
html.dark .gnss-row, html.dark .network-item { border-color: #2e2e2e !important; }
html.dark .network-item { background: #1e1e1e !important; }
html.dark .network-item:active, html.dark .network-item.selected { background: #2a2a2a !important; }
html.dark .inline-expand { background: #252525 !important; border-color: #333 !important; }
html.dark .wifi-bars .bar { background: #444 !important; }
html.dark input, html.dark select, html.dark textarea,
html.dark .inline-password input { background: #2a2a2a !important; border-color: #444 !important; color: #f0f0f0 !important; }
html.dark input:focus, html.dark select:focus, html.dark textarea:focus,
html.dark .inline-password input:focus { border-color: #26c6c0 !important; outline: none !important; }
html.dark .filter-btn { background: #2a2a2a !important; border-color: #444 !important; color: #c0c0c0 !important; }
html.dark .filter-btn.active { background: #0e3835 !important; border-color: #26c6c0 !important; color: #26c6c0 !important; }
html.dark .info-btn { border-color: #444 !important; color: #a0a0a0 !important; }
html.dark .status.loading { background: #0e3835 !important; color: #26c6c0 !important; }
html.dark .status.error   { background: #3a1010 !important; color: #ff7070 !important; }
html.dark .status.success { background: #0e3020 !important; color: #4ade80 !important; }
html.dark .log-box { background: #151515 !important; border-color: #333 !important; color: #c8d0d8 !important; }
html.dark .summary { background: #252525 !important; }
html.dark .summary-bar { background: #3a3a3a !important; }
html.dark .s-body { background: #252525 !important; border-color: #383838 !important; }
html.dark .s-tab { background: #2a2a2a !important; color: #a0a0a0 !important; }
html.dark .s-tab.active { background: #26c6c0 !important; color: #fff !important; }
html.dark .s-tab:hover:not(.active) { background: #0e3835 !important; color: #26c6c0 !important; }
html.dark .ch-toggle { background: #2a2a2a !important; color: #a0a0a0 !important; border-color: #444 !important; }
html.dark #footer-bar { background: rgba(18,18,18,0.97) !important; border-color: #2e2e2e !important; color: #888 !important; }
html.dark #footer-bar a { color: #26c6c0 !important; }
</style>

<div id="footer-bar" style="position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;font-size:0.72em;color:#6f7680;z-index:40;background:rgba(245,247,248,0.95);border-top:1px solid #d8dde2;padding:4px 14px;">
    <span id="version-unlock" style="cursor:pointer;">ReXgen Control Center Version {{ version }}</span>
</div>

<script>
(function(){
/* ── Theme ──────────────────────────────────────────────────────────────── */
var theme='{{ theme }}';
if(theme==='dark') document.documentElement.classList.add('dark');

/* English only — expose identity translate function for template scripts */
window._t=function(s){ return s; };

var KEY = 'rexgen_show_modules_tab';
function applyModulesTabVisibility(){
    var show = sessionStorage.getItem(KEY) === '1';
    var tabs = document.querySelectorAll('.modules-tab-hidden');
    tabs.forEach(function(el){ el.style.display = show ? '' : 'none'; });
}
applyModulesTabVisibility();

var versionEl = document.getElementById('version-unlock');
if (versionEl) {
    var clicks = 0;
    var firstTs = 0;
    versionEl.addEventListener('click', function(){
        var now = Date.now();
        if (!firstTs || (now - firstTs) > 3000) {
            firstTs = now;
            clicks = 0;
        }
        clicks += 1;
        if (clicks >= 5) {
            sessionStorage.setItem(KEY, '1');
            applyModulesTabVisibility();
            clicks = 0;
            firstTs = 0;
        }
    });
}
})();
</script>
