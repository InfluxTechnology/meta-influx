<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipe Output</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0d0d0d;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #111111;
            border-bottom: 1px solid #222222;
            padding: 8px 16px;
            flex-shrink: 0;
        }
        .topbar-left  { display: flex; align-items: center; gap: 12px; }
        .topbar-right { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #20b2aa; text-decoration: none; font-size: 0.85em; font-weight: 600; }
        .back-btn:hover { color: #5ed8d1; }
        .pipe-label { color: #e0e0e0; font-size: 0.85em; font-weight: 600; font-family: 'Menlo', 'Courier New', monospace; }
        .pipe-channel { color: #20b2aa; }
        .pipe-sep     { color: #555; margin: 0 3px; }
        .pipe-type    { color: #888; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; display: inline-block; }
        .status-dot.live { background: #20b2aa; }
        .status-dot.idle { background: #555; }
        #statusLabel { font-size: 0.78em; color: #86868b; }
        #lineCount   { font-size: 0.78em; color: #555; }
        .tb-btn {
            background: none; border: 1px solid #333; color: #888;
            border-radius: 6px; padding: 3px 10px; font-size: 0.78em; cursor: pointer; font-weight: 600;
        }
        .tb-btn:hover { border-color: #20b2aa; color: #20b2aa; }
        .tb-btn.active { border-color: #20b2aa; color: #20b2aa; background: #20b2aa18; }

        #output-wrap {
            flex: 1;
            overflow-y: auto;
            padding: 10px 14px;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 12.5px;
            line-height: 1.55;
        }
        .line { white-space: pre-wrap; word-break: break-all; }
        .line.rx  { color: #d0d0d0; }
        .line.err { color: #ff6b6b; }
        .line.sys { color: #c9a0ff; }
        .line.gnss { color: #66ccff; }
        .line.imu  { color: #ffcc66; }

        /* dim the pipe-path in status */
        .pipe-path-dim { color: #555; font-size: 0.75em; margin-left: 6px; font-family: monospace; }

        #noDataMsg {
            color: #444;
            font-size: 0.85em;
            margin-top: 24px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-left">
            <a href="/rexgend-settings" class="back-btn">&#8592; rexgend</a>
            <span class="pipe-label" id="pipeLabel">
                <span class="pipe-channel" id="lChannel"></span><span class="pipe-sep">/</span><span class="pipe-type" id="lType"></span>
            </span>
        </div>
        <div class="topbar-right">
            <span id="lineCount">0 lines</span>
            <span class="status-dot idle" id="statusDot"></span>
            <span id="statusLabel">Waiting…</span>
            <button class="tb-btn" id="btnPause" onclick="togglePause()">Pause</button>
            <button class="tb-btn" onclick="clearOutput()">Clear</button>
        </div>
    </div>
    <div id="output-wrap">
        <div id="output"></div>
        <div id="noDataMsg">Waiting for data&hellip;</div>
    </div>

    <script>
    var PIPE = "{{ pipe | e }}";
    var parts = PIPE.split('/');
    var channel = parts[0] || PIPE;
    var ptype   = parts[1] || '';

    document.getElementById('lChannel').textContent = channel;
    document.getElementById('lType').textContent    = ptype;
    document.title = PIPE + ' \u2014 Pipe Output';

    // Determine line CSS class from pipe type
    function lineClass() {
        if (ptype === 'err') return 'err';
        if (channel === 'gnss') return 'gnss';
        if (channel === 'gyro' || channel === 'acc') return 'imu';
        if (channel === 'sys') return 'sys';
        return 'rx';
    }
    var LINE_CLASS = lineClass();

    var lastSeq   = 0;
    var totalLines = 0;
    var paused    = false;
    var pollTimer = null;
    var liveTimer = null;
    var lastDataTime = 0;

    function setLive(yes) {
        var dot = document.getElementById('statusDot');
        var lbl = document.getElementById('statusLabel');
        dot.className = 'status-dot ' + (yes ? 'live' : 'idle');
        lbl.textContent = yes ? 'Live' : 'Idle';
    }

    function togglePause() {
        paused = !paused;
        var btn = document.getElementById('btnPause');
        btn.textContent = paused ? 'Resume' : 'Pause';
        btn.classList.toggle('active', paused);
        if (!paused) schedulePoll();
    }

    function clearOutput() {
        document.getElementById('output').innerHTML = '';
        document.getElementById('noDataMsg').style.display = '';
        totalLines = 0;
        document.getElementById('lineCount').textContent = '0 lines';
    }

    var outputEl = document.getElementById('output');
    var wrapEl   = document.getElementById('output-wrap');
    var MAX_DOM_LINES = 1000;

    function appendLines(lines) {
        if (!lines.length) return;
        document.getElementById('noDataMsg').style.display = 'none';
        var frag = document.createDocumentFragment();
        lines.forEach(function(l) {
            var div = document.createElement('div');
            div.className = 'line ' + LINE_CLASS;
            // Highlight error keyword in err lines
            div.textContent = l.text;
            frag.appendChild(div);
        });
        outputEl.appendChild(frag);
        totalLines += lines.length;

        // Trim oldest lines from DOM to avoid memory bloat
        while (outputEl.childElementCount > MAX_DOM_LINES) {
            outputEl.removeChild(outputEl.firstChild);
        }

        document.getElementById('lineCount').textContent = totalLines + ' lines';

        // Auto-scroll unless paused
        if (!paused) {
            wrapEl.scrollTop = wrapEl.scrollHeight;
        }
    }

    function schedulePoll() {
        if (paused) return;
        pollTimer = setTimeout(pollPipe, 500);
    }

    function pollPipe() {
        if (paused) return;
        fetch('/api/pipes/read?pipe=' + encodeURIComponent(PIPE) + '&seq=' + lastSeq)
            .then(function(r) { return r.json(); })
            .then(function(d) {
                if (d.lines && d.lines.length) {
                    appendLines(d.lines);
                    lastSeq = d.seq;
                    lastDataTime = Date.now();
                    setLive(true);
                    // Reset idle timer
                    clearTimeout(liveTimer);
                    liveTimer = setTimeout(function() { setLive(false); }, 3000);
                }
                schedulePoll();
            })
            .catch(function() {
                schedulePoll();
            });
    }

    // Start
    schedulePoll();
    </script>
</body>
</html>
