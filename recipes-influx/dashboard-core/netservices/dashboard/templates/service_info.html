<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Info</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 17px; margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(180deg, #f2fbfa 0%, #dff2ef 100%); }
        a { color: #20b2aa; cursor: pointer; text-decoration: none; } a:hover { color: #5ed8d1; }
        .container { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 640px; width: 94%; }
        .top-switch { display: flex; background: #f5f5f7; border-radius: 16px 16px 0 0; overflow: hidden; margin: -20px -20px 12px -20px; }
        .top-switch a { flex: 1; height: 64px; text-decoration: none; color: #20b2aa; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        .top-switch a.active { background: #fff; color: #178a83; }
        .top-switch svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .top-switch .tab-label { font-size: 0.62em; font-weight: 600; line-height: 1; white-space: nowrap; text-align: center; }
        .detail-header { display: flex; align-items: center; margin-bottom: 14px; }
        .back-btn { font-size: 1.3em; margin-right: 10px; text-decoration: none; line-height: 1; }
        .detail-title { font-size: 1.05em; font-weight: 600; color: #333; flex: 1; text-align: center; margin-right: 18px; }
        .detail-subtitle { margin: -8px 0 10px 0; text-align: center; color: #86868b; font-size: 0.85em; word-break: break-word; }
        .section-links { display: flex; justify-content: flex-end; gap: 6px; font-size: 0.75em; margin-bottom: 8px; }
        .sep { color: #c7c7cc; }
        .info-table { font-size: 0.9em; }
        .info-row { display: grid; grid-template-columns: auto 1fr; border-bottom: 1px solid #e5e5e7; }
        .info-row:last-child { border-bottom: none; }
        .info-key, .info-val { padding: 9px 0; }
        .info-key { color: #86868b; white-space: nowrap; }
        .info-val { color: #333; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .log-box { margin-top: 10px; border: 1px solid #e5e5e7; border-radius: 8px; background: #f9fafb; padding: 10px; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.78em; max-height: 300px; overflow: auto; color: #1f2937; display: none; }
        .error { text-align: center; color: #c62828; padding: 10px; }
    </style>
    <!-- footer-safe-space -->    <style>body { padding-bottom: 64px !important; } .container { margin-top: 36px; }</style>
</head>
<body>
    {% include '_logout.html' %}
    <div class="container">
    {% include '_topnav.html' %}
    <div class="detail-header"><a class="back-btn" href="/services">&larr;</a><span class="detail-title">Device Information</span></div>
    <div id="unitTitle" class="detail-subtitle">Service: Loading...</div>
    <div id="error" class="error" style="display:none;"></div>
    <div class="section-links"><a onclick="loadDetail()">Refresh</a><span class="sep">|</span><a onclick="loadLogs()">Show logs</a><span class="sep">|</span><a onclick="hideLogs()">Hide logs</a></div>
    <div id="table" class="info-table"></div>
    <div id="logs" class="log-box"></div>
    </div>
    <script>
    function q(name) { return new URLSearchParams(location.search).get(name) || ''; }
    function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
    var unit = q('unit');
    document.getElementById('unitTitle').textContent = 'Service: ' + (unit || 'Unknown');
    function loadDetail() {
        if (!unit) return;
        fetch('/api/system-services/' + encodeURIComponent(unit))
            .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,data:d}; }); })
            .then(function(resp){
                if (!resp.ok) throw new Error(resp.data.error || 'Failed');
                var d = resp.data || {};
                document.getElementById('unitTitle').textContent = 'Service: ' + (d.Id || unit);
                var rows = [
                    ['Description', d.Description || '--'],
                    ['Load State', d.LoadState || '--'],
                    ['Unit File State', d.UnitFileState || '--'],
                    ['Active State', d.ActiveState || '--'],
                    ['Sub State', d.SubState || '--'],
                    ['Main PID', d.MainPID || '--'],
                    ['Memory Current', d.MemoryCurrent || '--'],
                    ['Tasks Current', d.TasksCurrent || '--'],
                    ['Restart Policy', d.Restart || '--'],
                    ['Exec Status', d.ExecMainStatus || '--'],
                    ['Started', d.ExecMainStartTimestamp || '--'],
                    ['Exited', d.ExecMainExitTimestamp || '--'],
                    ['Fragment', d.FragmentPath || '--']
                ];
                var html = '';
                rows.forEach(function(r){ html += '<div class="info-row"><div class="info-key">' + esc(r[0]) + '</div><div class="info-val">' + esc(r[1]) + '</div></div>'; });
                document.getElementById('table').innerHTML = html;
            })
            .catch(function(e){
                document.getElementById('error').textContent = e.message || 'Failed to load service details';
                document.getElementById('error').style.display = 'block';
            });
    }
    function loadLogs() {
        if (!unit) return;
        var box = document.getElementById('logs');
        box.style.display = 'block';
        box.textContent = 'Loading logs...';
        fetch('/api/system-services/' + encodeURIComponent(unit) + '/logs?lines=120')
            .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,data:d}; }); })
            .then(function(resp){ box.textContent = resp.ok ? ((resp.data.log || '').trim() || 'No logs') : (resp.data.error || 'Failed to load logs'); })
            .catch(function(){ box.textContent = 'Failed to load logs'; });
    }
    function hideLogs() { var b = document.getElementById('logs'); b.style.display = 'none'; b.textContent = ''; }
    if (unit) loadDetail(); else { document.getElementById('error').textContent = 'Service unit is missing'; document.getElementById('error').style.display = 'block'; }

</script>
    {% include '_footer.html' %}
</body>
</html>
