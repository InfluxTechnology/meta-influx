<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Information</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 17px; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(180deg, #f2fbfa 0%, #dff2ef 100%); }
        .container { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 420px; width: 94%; }
        .header { display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
        .title { font-size: 1.1em; font-weight: 600; color: #333; text-align: center; width: 100%; }
        .top-switch { display: flex; background: #f5f5f7; border-radius: 16px 16px 0 0; overflow: hidden; margin: -20px -20px 12px -20px; }
        .top-switch a { flex: 1; height: 64px; text-decoration: none; color: #20b2aa; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        .top-switch a.active { background: #fff; color: #178a83; }
        .top-switch svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .top-switch .tab-label { font-size: 0.62em; font-weight: 600; line-height: 1; white-space: nowrap; text-align: center; }
        .card { margin-top: 12px; overflow: hidden; }
        .card:first-of-type { margin-top: 0; }
        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 15px; background: #f5f5f7; }
        .section-label { font-size: 0.75em; color: #86868b; text-transform: uppercase; letter-spacing: 0.5px; line-height: 1; }
        .info-table { font-size: 0.9em; }
        .info-row { display: grid; grid-template-columns: 46% 54%; border-bottom: 1px solid #eef0f2; }
        .info-row:last-child { border-bottom: none; }
        .info-key, .info-val { padding: 8px 12px; }
        .info-key { color: #86868b; white-space: nowrap; }
        .info-val { color: #222; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: clip; }
        .info-row.value-below { grid-template-columns: 1fr; }
        .info-row.value-below .info-key { padding-bottom: 2px; }
        .info-row.value-below .info-val { padding-top: 0; text-align: right; white-space: nowrap; overflow: visible; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-switch">
            <a href="/device-info" class="active" title="Device Information" aria-label="Device Information">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="11.5" x2="12" y2="16"></line><circle cx="12" cy="7" r="0.75"></circle></svg>
                <span class="tab-label">Device</span>
            </a>
            <a href="/wifi-settings" title="Wi-Fi Settings" aria-label="Wi-Fi Settings">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9a12 12 0 0 1 16 0"></path><path d="M7 12a8 8 0 0 1 10 0"></path><path d="M10 15a4 4 0 0 1 4 0"></path><circle cx="12" cy="19" r="1"></circle></svg>
                <span class="tab-label">Wi-Fi</span>
            </a>
            <a href="/ap-settings" title="Access Point Settings" aria-label="Access Point Settings">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="7" rx="2"></rect><path d="M8 11V8"></path><path d="M12 11V7"></path><path d="M16 11V9"></path><circle cx="9" cy="14.5" r="0.8"></circle><circle cx="13" cy="14.5" r="0.8"></circle></svg>
                <span class="tab-label">AP</span>
            </a>
            <a href="/rexgend-settings" title="rexgend Settings" aria-label="rexgend Settings">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4.8a7 7 0 0 0-1.7-1l-.3-2.5h-4l-.3 2.5a7 7 0 0 0-1.7 1l-2.4-.8-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-.8a7 7 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7 7 0 0 0 1.7-1l2.4.8 2-3.5-2-1.5c.1-.3.1-.7.1-1z"></path></svg>
                <span class="tab-label">rexgend</span>
            </a>
        </div>
        <div class="header">
            <span class="title">Device Information</span>
        </div>
        <div class="card">
            <div class="section-header"><span class="section-label">Linux information</span></div>
            <div class="info-table">
                <div class="info-row"><div class="info-key">Version</div><div class="info-val" id="diImage">--</div></div>
                <div class="info-row"><div class="info-key">Linux Version</div><div class="info-val" id="diLinux">--</div></div>
                <div class="info-row"><div class="info-key">ReXgend Version</div><div class="info-val" id="diRexgend">--</div></div>
            </div>
        </div>
        <div class="card">
            <div class="section-header"><span class="section-label">ReXgen information</span></div>
            <div class="info-table">
                <div class="info-row"><div class="info-key">Serial Number</div><div class="info-val" id="diSerial">--</div></div>
                <div class="info-row"><div class="info-key">Firmware Version</div><div class="info-val" id="diFirmware">--</div></div>
                <div class="info-row"><div class="info-key">CPU Type</div><div class="info-val" id="diCpu">--</div></div>
                <div class="info-row"><div class="info-key">Configuration Name</div><div class="info-val" id="diCfgName">--</div></div>
                <div class="info-row"><div class="info-key">Configuration UID</div><div class="info-val" id="diCfgUid">--</div></div>
            </div>
        </div>
    </div>
    <script>
        function measureTextWidth(text, font) {
            var probe = document.createElement('span');
            probe.textContent = text || '';
            probe.style.position = 'fixed';
            probe.style.visibility = 'hidden';
            probe.style.whiteSpace = 'nowrap';
            probe.style.font = font;
            document.body.appendChild(probe);
            var width = probe.getBoundingClientRect().width;
            probe.remove();
            return width;
        }

        function refreshRowLayout(el) {
            var valueCell = el;
            var row = valueCell && valueCell.closest('.info-row');
            if (!row) return;

            row.classList.remove('value-below');
            requestAnimationFrame(function() {
                var valueFont = window.getComputedStyle(valueCell).font;
                var textWidth = measureTextWidth(valueCell.textContent, valueFont);
                var availableWidth = valueCell.clientWidth;
                if (textWidth > availableWidth + 1) {
                    row.classList.add('value-below');
                }
            });
        }

        function setText(id, value) {
            var el = document.getElementById(id);
            if (el) {
                var text = (value && String(value).trim()) ? value : '--';
                el.textContent = text;
                el.title = text;
                refreshRowLayout(el);
            }
        }
        function refreshAllRows() {
            ['diImage', 'diLinux', 'diRexgend', 'diSerial', 'diFirmware', 'diCpu', 'diCfgName', 'diCfgUid'].forEach(function(id) {
                var el = document.getElementById(id);
                if (el) refreshRowLayout(el);
            });
        }
        fetch('/api/device-info')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                setText('diImage', data.image_version);
                setText('diLinux', data.linux_version);
                setText('diRexgend', data.rexgend_version);
                setText('diSerial', data.serial_number);
                setText('diFirmware', data.firmware_version);
                setText('diCpu', data.cpu_type);
                setText('diCfgName', data.configuration_name);
                setText('diCfgUid', data.configuration_uid);
            })
            .catch(function() {
                setText('diImage', 'Unavailable');
            });
        window.addEventListener('resize', refreshAllRows);
    </script>
</body>
</html>
