<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rexgend Settings</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 17px; margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(180deg, #f2fbfa 0%, #dff2ef 100%); }
        a { color: #20b2aa; }
        a:hover { color: #5ed8d1; }
        .top-switch a:hover { color: #5ed8d1; }
        .container { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 640px; width: 94%; }
        .header { display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
        .title { font-size: 1.1em; font-weight: 600; color: #333; text-align: center; width: 100%; }
        .top-switch { display: flex; background: #f5f5f7; border-radius: 16px 16px 0 0; overflow: hidden; margin: -20px -20px 12px -20px; }
        .top-switch a { flex: 1; height: 64px; text-decoration: none; color: #20b2aa; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        .top-switch a.active { background: #fff; color: #178a83; }
        .top-switch svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .top-switch .tab-label { font-size: 0.62em; font-weight: 600; line-height: 1; white-space: nowrap; text-align: center; }
        .path { font-size: 0.8em; color: #86868b; margin-bottom: 10px; word-break: break-all; }
        .card { margin-top: 10px; overflow: hidden; }
        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 15px; background: #f5f5f7; }
        .section-label { font-size: 0.75em; color: #86868b; text-transform: uppercase; letter-spacing: 0.5px; line-height: 1; }
        .card-body { padding: 12px; }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
        .row:last-child { margin-bottom: 0; }
        .row label { color: #333; font-size: 0.9em; }
        input[type="number"] { width: 120px; padding: 8px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 0.9em; }
        input[type="checkbox"] { width: 18px; height: 18px; accent-color: #20b2aa; }
        .actions { margin-top: 12px; display: flex; gap: 8px; }
        .btn { flex: 1; padding: 10px 12px; border: none; border-radius: 6px; font-size: 0.92em; font-weight: 600; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #20b2aa 0%, #178a83 100%); color: #fff; }
        .btn-secondary { background: #f2f4f6; color: #333; }
        .hint { margin-top: 10px; font-size: 0.82em; color: #86868b; }
        .status { margin-top: 10px; padding: 10px; border-radius: 8px; display: none; font-size: 0.9em; }
        .status.loading { display: block; background: #e0f7f5; color: #178a83; }
        .status.error   { display: block; background: #ffebee; color: #c62828; }
        .status.success { display: block; background: #e8f5e9; color: #2e7d32; }

        /* Sensor card */
        .s-tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px 6px; }
        .s-tab {
            padding: 3px 14px; border-radius: 12px;
            background: #f5f5f7; color: #86868b;
            font-size: 0.73em; font-weight: 700; letter-spacing: 0.05em;
            cursor: pointer; border: none; font-family: inherit;
        }
        .s-tab.active          { background: #20b2aa; color: #fff; }
        .s-tab:hover:not(.active) { background: #e0f7f5; color: #178a83; }
        .s-body { background: #f8f9fa; margin: 8px; border-radius: 8px; overflow: hidden; min-height: 150px; border: 1px solid #e8e8e8; }
        #sensorCanvas { display: block; width: 100%; height: 150px; }
        #sensorText   { padding: 10px 14px; font-family: 'Menlo', monospace; font-size: 0.8em; color: #333; }
        #sensorMap    { height: 220px; }
        .s-dot { width: 7px; height: 7px; border-radius: 50%; background: #555; display: inline-block; }
        .s-dot.live { background: #20b2aa; }

        /* Channel toggles — lives inside .s-body */
        .s-vals { display: flex; flex-wrap: wrap; gap: 7px; padding: 8px 12px; }
        .ch-toggle {
            padding: 3px 10px; border-radius: 12px;
            background: #f5f5f7; color: #86868b;
            font-size: 0.73em; font-weight: 700;
            cursor: pointer; border: 1px solid #e0e0e0;
            font-family: 'Menlo', monospace; letter-spacing: 0.02em;
            transition: opacity .15s;
        }
        .ch-toggle.active  { color: #fff; border-color: transparent; }
        .ch-toggle:not(.active) { opacity: 0.38; }

        /* GNSS */
        .gnss-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 8px; }
        .gnss-row  { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px solid #efefef; }
        .gnss-key  { color: #86868b; }
        .gnss-val  { color: #178a83; font-weight: 600; }

    </style>
    <!-- footer-safe-space -->    <style>body { padding-bottom: 64px !important; } .container { margin-top: 36px; }</style>
</head>
<body>
    {% include '_logout.html' %}
    <div class="container">
        {% include '_topnav.html' %}
        <div class="header">
            <span class="title">rexgend Settings</span>
        </div>

        {% if experimental %}
        <!-- Sensor chart card (hidden until sensor pipes are found) -->
        <div id="sensorCard" class="card" style="display:none; margin-bottom: 14px;">
            <div id="sensorTabs" class="s-tabs" style="align-items:center;">
                <span id="sensorLiveDot" class="s-dot" style="margin-left:auto;margin-right:4px;"></span>
            </div>
            <div class="s-body">
                <canvas id="sensorCanvas"></canvas>
                <div id="sensorMap" style="display:none;"></div>
                <div id="sensorText" style="display:none;"></div>
                <div id="sensorValBar" class="s-vals"></div>
            </div>
        </div>
        {% endif %}

        <div class="path">Config file: <span id="cfgPath">/data/rexgen/config/rexgend.conf</span></div>

        <div class="card">
            <div class="section-header"><span class="section-label">Live data</span></div>
            <div class="card-body">
                <div class="row"><label>Use SocketCAN</label><input id="use_socketcan" type="checkbox"></div>
            </div>
        </div>

        <div class="card">
            <div class="section-header"><span class="section-label">Storage</span></div>
            <div class="card-body">
                <div class="row"><label>Use Space Limit</label><input id="use_space_limit" type="checkbox"></div>
                <div class="row"><label>Max Space Percent</label><input id="max_space_percent" type="number" min="1" max="100"></div>
            </div>
        </div>

        <div class="card">
            <div class="section-header"><span class="section-label">CAN bus</span></div>
            <div class="card-body">
                <div class="row"><label>Log Errors</label><input id="log_errors" type="checkbox"></div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-secondary" onclick="loadConfig()">Reload</button>
            <button id="saveBtn" class="btn btn-primary" onclick="saveConfig()">Save</button>
        </div>
        <div class="hint">Saving configuration restarts rexgend.service.</div>
        <div id="status" class="status"></div>
    </div>

    <script>
    {% if experimental %}
    // ── Sensor chart ────────────────────────────────────────────────────
    var SENSOR_PIPES = ['acc','gyro','adc','dig','gnss'];
    var STEP_PIPES   = ['dig'];
    var COLORS       = ['#20b2aa','#e53935','#0288d1','#f57c00','#8e24aa','#2e7d32'];
    var MAX_PTS      = 80;

    var sBufs          = {};  // { pipe: { chName: [vals] } }
    var sLatest        = {};  // { pipe: { chName: latestVal } }
    var sSeqs          = {};  // { pipe: lastSeq }
    var sChannelActive = {};  // { pipe: { chName: true/false } }
    var sActive        = null;
    var sPollTmr       = null;
    var sLiveTmr       = null;
    var leafMap        = null;
    var leafMark       = null;
    var leafReady      = false;

    function sCh(pipe) { return pipe ? pipe.split('/')[0] : ''; }

    function chLabel(raw) {
        var m1 = raw.match(/^(?:acc|gyro)_([xyz])$/i);
        if (m1) return m1[1].toUpperCase();
        var m2 = raw.match(/^(?:adc|dig)_?(\d+)$/i);
        if (m2) return 'CH' + m2[1];
        return raw;
    }

    function fmtVal(v) {
        if (v === undefined || v === null) return '---';
        var n = Number(v);
        return (n < 0 ? '-' : '+') + Math.abs(n).toFixed(3);
    }

    function esc(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function parseLine(text) {
        var m = text.match(/^\(\d+\)\s+(\S+)\s+([-+]?\d*\.?\d+(?:[eE][-+]?\d+)?)/);
        return m ? { name: m[1], value: parseFloat(m[2]) } : null;
    }

    function pushVal(pipe, name, val) {
        if (!sBufs[pipe]) sBufs[pipe] = {};
        if (!sBufs[pipe][name]) sBufs[pipe][name] = [];
        sBufs[pipe][name].push(val);
        if (sBufs[pipe][name].length > MAX_PTS) sBufs[pipe][name].shift();
        if (!sLatest[pipe]) sLatest[pipe] = {};
        sLatest[pipe][name] = val;
    }

    function isChOn(pipe, name) {
        return !sChannelActive[pipe] || sChannelActive[pipe][name] !== false;
    }

    function toggleChannel(pipe, name) {
        if (!sChannelActive[pipe]) sChannelActive[pipe] = {};
        sChannelActive[pipe][name] = !isChOn(pipe, name);
        renderSensor();
    }

    function switchSensor(pipe) {
        sActive = pipe;
        clearTimeout(sPollTmr);
        document.querySelectorAll('.s-tab').forEach(function(t) {
            t.classList.toggle('active', t.dataset.pipe === pipe);
        });
        renderSensor();
        pollSensor();
    }

    function pollSensor() {
        if (!sActive) return;
        var seq = sSeqs[sActive] || 0;
        fetch('/api/pipes/read?pipe=' + encodeURIComponent(sActive) + '&seq=' + seq)
            .then(function(r) { return r.json(); })
            .then(function(d) {
                if (d.lines && d.lines.length) {
                    var ch = sCh(sActive);
                    d.lines.forEach(function(l) {
                        var p = parseLine(l.text);
                        if (p) pushVal(sActive, p.name, p.value);
                    });
                    sSeqs[sActive] = d.seq;
                    renderSensor();
                    var dot = document.getElementById('sensorLiveDot');
                    if (dot) dot.className = 's-dot live';
                    clearTimeout(sLiveTmr);
                    sLiveTmr = setTimeout(function() {
                        var d2 = document.getElementById('sensorLiveDot');
                        if (d2) d2.className = 's-dot';
                    }, 3000);
                }
                sPollTmr = setTimeout(pollSensor, 500);
            })
            .catch(function() { sPollTmr = setTimeout(pollSensor, 500); });
    }

    function renderSensor() {
        var ch      = sCh(sActive);
        var canvas  = document.getElementById('sensorCanvas');
        var mapDiv  = document.getElementById('sensorMap');
        var textDiv = document.getElementById('sensorText');
        if (ch === 'gnss') {
            canvas.style.display = 'none';
            textDiv.style.display = 'block';
            renderGnss(); return;
        }
        mapDiv.style.display = 'none';
        textDiv.style.display = 'none';
        canvas.style.display = 'block';
        drawChart();
        renderToggles();
    }

    function drawChart() {
        var canvas = document.getElementById('sensorCanvas');
        if (!canvas) return;
        var dark = document.documentElement.classList.contains('dark');
        var W = canvas.parentElement.clientWidth || 580;
        canvas.width = W; canvas.height = 150;
        var ctx = canvas.getContext('2d');
        var H = 150;
        ctx.fillStyle = dark ? '#252525' : '#f8f9fa'; ctx.fillRect(0, 0, W, H);

        var allNames = Object.keys(sBufs[sActive] || {});
        var names    = allNames.filter(function(n) { return isChOn(sActive, n); });
        if (!names.length) {
            ctx.fillStyle = dark ? '#666' : '#cccccc'; ctx.font = '11px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('Waiting for data\u2026', W / 2, H / 2); return;
        }

        var isStep = STEP_PIPES.indexOf(sCh(sActive)) !== -1;
        var allVals = [];
        names.forEach(function(n) { allVals = allVals.concat(sBufs[sActive][n]); });
        var mn = Math.min.apply(null, allVals);
        var mx = Math.max.apply(null, allVals);
        if (mn === mx) { mn -= 0.5; mx += 0.5; }
        var span = mx - mn;
        mn -= span * 0.08; mx += span * 0.08;

        var PL = 48, PR = 12, PT = 8, PB = 10;
        var cW = W - PL - PR, cH = H - PT - PB;

        ctx.lineWidth = 1;
        for (var g = 0; g <= 4; g++) {
            var gy = PT + (g / 4) * cH;
            ctx.strokeStyle = dark ? '#383838' : '#e0e0e0';
            ctx.beginPath(); ctx.moveTo(PL, gy); ctx.lineTo(PL + cW, gy); ctx.stroke();
            ctx.fillStyle = dark ? '#888' : '#aaaaaa'; ctx.font = '8.5px monospace'; ctx.textAlign = 'right';
            ctx.fillText((mx - (g / 4) * (mx - mn)).toFixed(2), PL - 3, gy + 3);
        }

        names.forEach(function(name) {
            var idx  = allNames.indexOf(name);
            var data = sBufs[sActive][name];
            if (!data || !data.length) return;
            var N = data.length;
            ctx.strokeStyle = COLORS[idx % COLORS.length];
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            data.forEach(function(v, j) {
                var x = PL + (j / Math.max(N - 1, 1)) * cW;
                var y = PT + ((mx - v) / (mx - mn)) * cH;
                if (j === 0) { ctx.moveTo(x, y); return; }
                if (isStep) {
                    ctx.lineTo(x, PT + ((mx - data[j-1]) / (mx - mn)) * cH);
                }
                ctx.lineTo(x, y);
            });
            ctx.stroke();
            var last = data[data.length - 1];
            var ly = PT + ((mx - last) / (mx - mn)) * cH;
            ctx.fillStyle = COLORS[idx % COLORS.length];
            ctx.font = '8px monospace'; ctx.textAlign = 'left';
            ctx.fillText(chLabel(name), PL + cW + 2, ly + 3);
        });
    }

    function renderToggles() {
        var el       = document.getElementById('sensorValBar');
        var allNames = Object.keys(sBufs[sActive] || {});
        var latest   = sLatest[sActive] || {};
        if (!allNames.length) { el.innerHTML = ''; return; }
        el.innerHTML = allNames.map(function(name, idx) {
            var on    = isChOn(sActive, name);
            var color = COLORS[idx % COLORS.length];
            var bg    = on ? 'background:' + color + ';border-color:' + color + ';' : '';
            var v     = latest[name];
            return '<button class="ch-toggle' + (on ? ' active' : '') + '" style="' + bg + '"' +
                   ' data-pipe="' + esc(sActive) + '" data-ch="' + esc(name) + '">' +
                   chLabel(name) + ': <b>' + fmtVal(v) + '</b></button>';
        }).join('');
        el.querySelectorAll('.ch-toggle').forEach(function(btn) {
            btn.addEventListener('click', function() {
                toggleChannel(btn.dataset.pipe, btn.dataset.ch);
            });
        });
    }

    // ── GNSS ────────────────────────────────────────────────────────────
    var GNSS_UNITS = {
        Latitude:'°', Longitude:'°', Altitude:' m', SpeedOverGround:' km/h',
        CourseOverGround:'°', GroundDistance:' m', NumberSatellites:'',
        Quality:'', HorizontalAccuracy:' m', VerticalAccuracy:' m',
        SpeedAccuracy:' m/s', GeoidSeparation:' m'
    };

    function renderGnss() {
        var mapDiv  = document.getElementById('sensorMap');
        var textDiv = document.getElementById('sensorText');
        var vb      = document.getElementById('sensorValBar');
        var latest  = sLatest[sActive] || {};
        var lat     = latest['Latitude'];
        var lon     = latest['Longitude'];
        var quality = latest['Quality'];
        var sats    = latest['NumberSatellites'];
        // Quality comes only from GGA sentences; fall back to NumberSatellites > 0
        var hasFix  = (lat !== undefined && lon !== undefined) &&
                      (quality !== undefined ? Number(quality) > 0
                                             : (sats !== undefined && Number(sats) > 0));

        // Map only when we have a valid fix
        if (hasFix) {
            mapDiv.style.display = 'block';
            if (!leafReady) {
                leafReady = true;
                var lnk = document.createElement('link');
                lnk.rel = 'stylesheet';
                lnk.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
                document.head.appendChild(lnk);
                var scr = document.createElement('script');
                scr.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
                scr.onload = function() { initLeaflet(lat, lon); updateMap(lat, lon); };
                document.head.appendChild(scr);
            } else if (typeof L !== 'undefined') {
                if (!leafMap) initLeaflet(lat, lon);
                updateMap(lat, lon);
            }
            if (leafMap) setTimeout(function() { leafMap.invalidateSize(); }, 30);
        } else {
            mapDiv.style.display = 'none';
        }

        // Values table
        var keys = Object.keys(latest);
        textDiv.innerHTML = keys.length
            ? '<div class="gnss-grid">' + keys.map(function(k) {
                var u = GNSS_UNITS[k] || '';
                var v = typeof latest[k] === 'number' ? latest[k].toFixed(6) : latest[k];
                return '<div class="gnss-row"><span class="gnss-key">' + esc(k) +
                       '</span><span class="gnss-val">' + esc(String(v)) + u + '</span></div>';
            }).join('') + '</div>'
            : '<div style="color:#555;font-size:0.85em;padding:10px">Waiting for GNSS data\u2026</div>';

        vb.innerHTML = hasFix
            ? '<span style="color:#178a83;font-family:Menlo,monospace;font-size:0.8em">Lat <b>' + lat.toFixed(6) + '</b></span>' +
              '<span style="color:#b08000;font-family:Menlo,monospace;font-size:0.8em">Lon <b>' + lon.toFixed(6) + '</b></span>' +
              (latest['Altitude'] !== undefined
                  ? '<span style="color:#6a1b9a;font-family:Menlo,monospace;font-size:0.8em">Alt <b>' + Number(latest['Altitude']).toFixed(1) + ' m</b></span>' : '')
            : '<span style="color:#bdbdbd;font-size:0.8em">No GPS fix</span>';
    }

    function initLeaflet(lat, lon) {
        var el = document.getElementById('sensorMap');
        if (!el || leafMap) return;
        leafMap = L.map('sensorMap').setView([lat || 51.5, lon || 0], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '\xa9 OpenStreetMap', maxZoom: 19
        }).addTo(leafMap);
    }

    function updateMap(lat, lon) {
        if (!leafMap) return;
        if (!leafMark) {
            leafMark = L.marker([lat, lon]).addTo(leafMap);
            leafMap.setView([lat, lon], 14);
        } else {
            leafMark.setLatLng([lat, lon]);
        }
    }

    // ── Sensor tab discovery ─────────────────────────────────────────────
    function loadSensors() {
        fetch('/api/pipes')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var pipes = (data.pipes || []).filter(function(p) {
                    return p.readable && SENSOR_PIPES.indexOf(p.channel) !== -1;
                }).sort(function(a, b) {
                    // GNSS always last
                    if (a.channel === 'gnss') return 1;
                    if (b.channel === 'gnss') return -1;
                    return SENSOR_PIPES.indexOf(a.channel) - SENSOR_PIPES.indexOf(b.channel);
                });
                if (!pipes.length) return;
                var card   = document.getElementById('sensorCard');
                var tabsEl = document.getElementById('sensorTabs');
                card.style.display = 'block';
                tabsEl.innerHTML   = '';
                pipes.forEach(function(p, i) {
                    var btn = document.createElement('button');
                    btn.className    = 's-tab';
                    btn.dataset.pipe = p.path;
                    btn.textContent  = p.channel.toUpperCase();
                    btn.onclick = (function(pipe) {
                        return function() { switchSensor(pipe); };
                    })(p.path);
                    tabsEl.appendChild(btn);
                    if (i === 0) switchSensor(p.path);
                });
            })
            .catch(function() {});
    }
    {% endif %}

    // ── rexgend config ───────────────────────────────────────────────────
    function setStatus(type, text) {
        var el = document.getElementById('status');
        el.className = 'status ' + type;
        el.textContent = text;
        el.style.display = 'block';
    }

    function setValues(data) {
        document.getElementById('cfgPath').textContent = data.config_path || '/data/rexgen/config/rexgend.conf';
        document.getElementById('use_socketcan').checked  = !!data.use_socketcan;
        document.getElementById('use_space_limit').checked = !!data.use_space_limit;
        document.getElementById('max_space_percent').value = data.max_space_percent;
        document.getElementById('log_errors').checked = !!data.log_errors;
    }

    function loadConfig() {
        setStatus('loading', 'Loading rexgend.conf...');
        fetch('/api/rexgend-config')
            .then(function(r) { return r.json(); })
            .then(function(data) { setValues(data); setStatus('success', 'Configuration loaded'); })
            .catch(function() { setStatus('error', 'Failed to load rexgend configuration'); });
    }

    function saveConfig() {
        var payload = {
            use_socketcan:    document.getElementById('use_socketcan').checked  ? 1 : 0,
            use_space_limit:  document.getElementById('use_space_limit').checked ? 1 : 0,
            max_space_percent: parseInt(document.getElementById('max_space_percent').value || '0', 10),
            log_errors:       document.getElementById('log_errors').checked ? 1 : 0
        };
        if (!confirm('Save rexgend.conf changes and restart rexgend now?')) return;
        payload.restart = true;
        var btn = document.getElementById('saveBtn');
        btn.disabled = true;
        setStatus('loading', 'Saving and restarting rexgend...');
        fetch('/api/rexgend-config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
        .then(function(resp) {
            btn.disabled = false;
            if (!resp.ok) { setStatus('error', resp.data.error || 'Failed to save configuration'); return; }
            setStatus('success', 'Configuration saved. rexgend restarted.');
        })
        .catch(function() { btn.disabled = false; setStatus('error', 'Save request failed'); });
    }

    loadConfig();
    {% if experimental %}loadSensors();{% endif %}
    </script>
    {% include '_footer.html' %}
</body>
</html>
