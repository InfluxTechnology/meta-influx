<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device information</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 17px; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(180deg, #f2fbfa 0%, #dff2ef 100%); }
        .container { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 420px; width: 94%; }
        .header { display: flex; align-items: center; margin-bottom: 14px; }
        .title { font-size: 1.1em; font-weight: 600; color: #333; }
        .top-switch { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #d9d9dd; padding: 8px 4px 10px 4px; margin-bottom: 12px; }
        .top-switch a { text-decoration: none; color: #202124; width: 44px; height: 44px; border-radius: 50%; border: 2px solid transparent; display: inline-flex; align-items: center; justify-content: center; font-size: 1.45em; }
        .top-switch a.active { border-color: #202124; }
        .top-switch .arrow { color: #20b2aa; font-size: 1.9em; line-height: 1; margin: 0 2px; }
        .card { border: 1px solid #e5e5e7; border-radius: 10px; margin-top: 12px; overflow: hidden; }
        .card:first-of-type { margin-top: 0; }
        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #f5f5f7; }
        .section-label { font-size: 0.75em; color: #86868b; text-transform: uppercase; letter-spacing: 0.5px; line-height: 1; }
        .info-table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        .info-table tr { border-bottom: 1px solid #eef0f2; }
        .info-table tr:last-child { border-bottom: none; }
        .info-table td { padding: 8px 12px; vertical-align: top; }
        .info-table td:first-child { color: #86868b; width: 46%; }
        .info-table td:last-child { color: #222; text-align: right; word-break: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-switch">
            <a href="/settings/device-info" class="active" title="Device information">i</a>
            <a href="/wifi-settings" title="WiFi Settings">&#128246;</a>
            <span class="arrow">&rsaquo;</span>
            <a href="/settings/ap-password" title="AP Password">&#128273;</a>
            <a href="/settings/rexgend-config" title="ReXgen Settings">&#9881;</a>
        </div>
        <div class="header">
            <span class="title">Device information</span>
        </div>
        <div class="card">
            <div class="section-header"><span class="section-label">Linux information</span></div>
            <table class="info-table">
                <tr><td>Version</td><td id="diImage">--</td></tr>
                <tr><td>Linux Version</td><td id="diLinux">--</td></tr>
                <tr><td>rexgend version</td><td id="diRexgend">--</td></tr>
            </table>
        </div>
        <div class="card">
            <div class="section-header"><span class="section-label">ReXgen information</span></div>
            <table class="info-table">
                <tr><td>Serial Number</td><td id="diSerial">--</td></tr>
                <tr><td>Firmware Version</td><td id="diFirmware">--</td></tr>
                <tr><td>CPU Type</td><td id="diCpu">--</td></tr>
                <tr><td>Configuration Name</td><td id="diCfgName">--</td></tr>
                <tr><td>Configuration UID</td><td id="diCfgUid">--</td></tr>
            </table>
        </div>
    </div>
    <script>
        function setText(id, value) {
            var el = document.getElementById(id);
            if (el) el.textContent = (value && String(value).trim()) ? value : '--';
        }
        fetch('/api/device-info')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                setText('diImage', data.image_version);
                setText('diLinux', data.linux_version);
                setText('diRexgend', data.rexgend_version);
                setText('diSerial', data.serial_number);
                setText('diFirmware', data.firmware_version);
                setText('diCpu', data.cpu_type);
                setText('diCfgName', data.configuration_name);
                setText('diCfgUid', data.configuration_uid);
            })
            .catch(function() {
                setText('diImage', 'Unavailable');
            });
    </script>
</body>
</html>
