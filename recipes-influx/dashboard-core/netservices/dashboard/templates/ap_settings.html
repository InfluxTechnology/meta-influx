<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Point Settings</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 17px; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(180deg, #f2fbfa 0%, #dff2ef 100%); }
        .container { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 420px; width: 94%; }
        .header { display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
        .title { font-size: 1.1em; font-weight: 600; color: #333; text-align: center; width: 100%; }
        .top-switch { display: flex; background: #f5f5f7; border-radius: 16px 16px 0 0; overflow: hidden; margin: -20px -20px 12px -20px; }
        .top-switch a { flex: 1; height: 64px; text-decoration: none; color: #20b2aa; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        .top-switch a.active { background: #fff; color: #178a83; }
        .top-switch svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .top-switch .tab-label { font-size: 0.62em; font-weight: 600; line-height: 1; white-space: nowrap; text-align: center; }

        .card { margin-top: 12px; overflow: hidden; }
        .card:first-of-type { margin-top: 0; }
        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 15px; background: #f5f5f7; }
        .section-label { font-size: 0.75em; color: #86868b; text-transform: uppercase; letter-spacing: 0.5px; line-height: 1; }
        .section-link { font-size: 0.75em; color: #20b2aa; text-decoration: none; cursor: pointer; }

        .client-list { margin-bottom: 6px; }
        .network-item { display: flex; align-items: center; padding: 12px 15px; background: #fff; border-bottom: 1px solid #e5e5e7; }
        .network-item:last-child { border-bottom: none; }
        .network-name { font-size: 1em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #333; flex: 1; }
        .client-row { cursor: default; flex-wrap: wrap; padding-bottom: 0; }
        .client-meta { color: #86868b; font-size: 0.8em; display: flex; justify-content: space-between; width: 100%; padding: 2px 0 10px 0; }
        .client-ip { color: #4c5560; }
        .client-mac { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-align: right; }
        .client-empty { color: #999; text-align: center; padding: 12px; }
        .info-btn { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #c7c7cc; color: #86868b; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; margin-left: 8px; margin-top: 1px; align-self: flex-start; flex-shrink: 0; font-style: italic; font-family: Georgia, serif; }
        .detail-header { display: flex; align-items: center; margin-bottom: 14px; }
        .back-btn { font-size: 1.3em; color: #20b2aa; cursor: pointer; margin-right: 10px; text-decoration: none; line-height: 1; }
        .detail-title { font-size: 1.1em; font-weight: 600; color: #333; flex: 1; }
        .detail-table { width: 100%; border-collapse: collapse; }
        .detail-table tr { border-bottom: 1px solid #e5e5e7; }
        .detail-table tr:last-child { border-bottom: none; }
        .detail-table td { padding: 10px 0; font-size: 0.95em; }
        .detail-table td:first-child { color: #86868b; width: 40%; }
        .detail-table td:last-child { color: #333; text-align: right; }

        .card-body { padding: 14px; }
        .label { color: #555; margin-bottom: 8px; font-size: 0.95em; }
        .row { display: flex; gap: 8px; align-items: center; }
        input[type="password"], input[type="text"] { flex: 1; padding: 10px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 0.95em; outline: none; }
        input:focus { border-color: #20b2aa; }
        .toggle { color: #20b2aa; cursor: pointer; font-size: 0.85em; user-select: none; }
        .btn { margin-top: 10px; width: 100%; padding: 10px 14px; background: linear-gradient(135deg, #20b2aa 0%, #178a83 100%); color: #fff; border: none; border-radius: 6px; font-size: 0.92em; font-weight: 600; cursor: pointer; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .hint { margin-top: 10px; font-size: 0.82em; color: #86868b; }
        .status { margin-top: 12px; padding: 10px; border-radius: 8px; display: none; }
        .status.loading { display: block; background: #e0f7f5; color: #178a83; }
        .status.error { display: block; background: #ffebee; color: #c62828; }
        .status.success { display: block; background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-switch">
            <a href="/device-info" title="Device Information" aria-label="Device Information">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="11.5" x2="12" y2="16"></line><circle cx="12" cy="7" r="0.75"></circle></svg>
                <span class="tab-label">Device</span>
            </a>
            <a href="/wifi-settings" title="Wi-Fi Settings" aria-label="Wi-Fi Settings">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9a12 12 0 0 1 16 0"></path><path d="M7 12a8 8 0 0 1 10 0"></path><path d="M10 15a4 4 0 0 1 4 0"></path><circle cx="12" cy="19" r="1"></circle></svg>
                <span class="tab-label">Wi-Fi</span>
            </a>
            <a href="/ap-settings" class="active" title="Access Point Settings" aria-label="Access Point Settings">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="7" rx="2"></rect><path d="M8 11V8"></path><path d="M12 11V7"></path><path d="M16 11V9"></path><circle cx="9" cy="14.5" r="0.8"></circle><circle cx="13" cy="14.5" r="0.8"></circle></svg>
                <span class="tab-label">AP</span>
            </a>
            <a href="/rexgend-settings" title="rexgend Settings" aria-label="rexgend Settings">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4.8a7 7 0 0 0-1.7-1l-.3-2.5h-4l-.3 2.5a7 7 0 0 0-1.7 1l-2.4-.8-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-.8a7 7 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7 7 0 0 0 1.7-1l2.4.8 2-3.5-2-1.5c.1-.3.1-.7.1-1z"></path></svg>
                <span class="tab-label">rexgend</span>
            </a>
        </div>

        <div class="header">
            <span class="title">Access Point Settings</span>
        </div>

        <div id="apMainView">
            <div class="card">
                <div class="section-header">
                    <span class="section-label">Clients</span>
                    <span class="section-link" onclick="refreshClients(this)">Refresh</span>
                </div>
                <div id="clientsList" class="client-list">
                    <div class="client-empty">Loading clients...</div>
                </div>
            </div>

            <div class="card">
                <div class="section-header"><span class="section-label">Change Password</span></div>
                <div class="card-body">
                    <div class="row">
                        <input id="apPassword" type="password" placeholder="New password (8-63 chars)" autocomplete="new-password">
                        <span class="toggle" onclick="togglePwd()">Show</span>
                    </div>
                    <button id="saveBtn" class="btn" onclick="changeApPassword()">Save Password</button>
                    <div class="hint">Changing password restarts AP and disconnects connected AP clients.</div>
                    <div id="status" class="status"></div>
                </div>
            </div>
        </div>

        <div id="clientDetailView" style="display:none;">
            <div id="clientDetailContent"></div>
        </div>
    </div>

    <script>
        var lastClients = [];

        function esc(s) {
            return String(s || '').replace(/[&<>"']/g, function(c) {
                return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
            });
        }

        function setStatus(type, text) {
            var el = document.getElementById('status');
            el.className = 'status ' + type;
            el.textContent = text;
            el.style.display = 'block';
        }

        function togglePwd() {
            var input = document.getElementById('apPassword');
            var toggle = document.querySelector('.toggle');
            if (input.type === 'password') {
                input.type = 'text';
                toggle.textContent = 'Hide';
            } else {
                input.type = 'password';
                toggle.textContent = 'Show';
            }
        }

        function formatDuration(seconds) {
            if (seconds === null || seconds === undefined || isNaN(seconds)) return '--';
            var s = parseInt(seconds, 10);
            var h = Math.floor(s / 3600);
            var m = Math.floor((s % 3600) / 60);
            var sec = s % 60;
            if (h > 0) return h + 'h ' + m + 'm ' + sec + 's';
            if (m > 0) return m + 'm ' + sec + 's';
            return sec + 's';
        }

        function showMainView() {
            document.getElementById('clientDetailView').style.display = 'none';
            document.getElementById('apMainView').style.display = 'block';
        }

        function findClient(mac) {
            var target = String(mac || '').toLowerCase();
            return (lastClients || []).find(function(c) { return (c.mac || '').toLowerCase() === target; });
        }

        function showClientDetail(mac) {
            var c = findClient(mac);
            if (!c) return;
            var name = c.hostname || (c.mac || '--').toUpperCase();
            var ip = c.ip || '--';
            var macUpper = (c.mac || '--').toUpperCase();
            var txBitrate = c.tx_bitrate || '--';
            var rxBitrate = c.rx_bitrate || '--';
            var connectedTime = formatDuration(c.connected_time_s);
            var inactiveTime = (c.inactive_time_ms === null || c.inactive_time_ms === undefined || isNaN(c.inactive_time_ms))
                ? '--'
                : (parseInt(c.inactive_time_ms, 10) + ' ms');
            var beaconInterval = (c.beacon_interval === null || c.beacon_interval === undefined || isNaN(c.beacon_interval))
                ? '--'
                : String(c.beacon_interval);
            var dtim = (c.dtim_period === null || c.dtim_period === undefined || isNaN(c.dtim_period))
                ? '--'
                : String(c.dtim_period);
            var associated = c.associated || '--';
            var authenticated = c.authenticated || '--';
            var authorized = c.authorized || '--';

            var html = '<div class="detail-header">' +
                '<a class="back-btn" onclick="showMainView()">&larr;</a>' +
                '<span class="detail-title">' + esc(name) + '</span>' +
            '</div>' +
            '<table class="detail-table">' +
                '<tr><td>Status</td><td>Connected</td></tr>' +
                '<tr><td>IP Address</td><td>' + esc(ip) + '</td></tr>' +
                '<tr><td>MAC Address</td><td style="font-size:0.85em">' + esc(macUpper) + '</td></tr>' +
                '<tr><td>Connected Time</td><td>' + esc(connectedTime) + '</td></tr>' +
                '<tr><td>Inactive Time</td><td>' + esc(inactiveTime) + '</td></tr>' +
                '<tr><td>TX Bitrate</td><td>' + esc(txBitrate) + '</td></tr>' +
                '<tr><td>RX Bitrate</td><td>' + esc(rxBitrate) + '</td></tr>' +
                '<tr><td>Beacon Interval</td><td>' + esc(beaconInterval) + '</td></tr>' +
                '<tr><td>DTIM Period</td><td>' + esc(dtim) + '</td></tr>' +
                '<tr><td>Associated</td><td>' + esc(associated) + '</td></tr>' +
                '<tr><td>Authenticated</td><td>' + esc(authenticated) + '</td></tr>' +
                '<tr><td>Authorized</td><td>' + esc(authorized) + '</td></tr>' +
            '</table>';

            document.getElementById('clientDetailContent').innerHTML = html;
            document.getElementById('apMainView').style.display = 'none';
            document.getElementById('clientDetailView').style.display = 'block';
        }

        function renderClients(clients) {
            var list = document.getElementById('clientsList');
            clients = clients || [];
            lastClients = clients;
            if (!clients.length) {
                list.innerHTML = '<div class="client-empty">No clients connected</div>';
                return;
            }

            var html = '';
            clients.forEach(function(c) {
                var mac = (c.mac || '--').toUpperCase();
                var ip = c.ip || '--';
                var name = c.hostname || mac;
                html += '<div class="network-item client-row">' +
                    '<span class="network-name">' + esc(name) + '</span>' +
                    '<span class="info-btn" onclick="showClientDetail(\'' + esc(c.mac || '').toLowerCase() + '\')">i</span>' +
                    '<div class="client-meta"><span class="client-ip">' + esc(ip) + '</span><span class="client-mac">' + esc(mac) + '</span></div>' +
                '</div>';
            });
            list.innerHTML = html;
        }

        function loadClients() {
            fetch('/api/ap-clients')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    renderClients(data.clients || []);
                })
                .catch(function() {
                    document.getElementById('clientsList').innerHTML = '<div class="client-empty">Failed to load clients</div>';
                });
        }

        function refreshClients(el) {
            var t = el.textContent;
            el.textContent = 'Refreshing...';
            el.style.pointerEvents = 'none';
            fetch('/api/ap-clients')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    renderClients(data.clients || []);
                })
                .catch(function() {})
                .finally(function() {
                    el.textContent = t;
                    el.style.pointerEvents = '';
                });
        }

        function pollResult() {
            var tries = 0;
            var timer = setInterval(function() {
                tries++;
                fetch('/api/status')
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        if (data.ap_settings_error) {
                            clearInterval(timer);
                            document.getElementById('saveBtn').disabled = false;
                            setStatus('error', data.ap_settings_error);
                            return;
                        }
                        if (data.ap_settings_last_action) {
                            clearInterval(timer);
                            document.getElementById('saveBtn').disabled = false;
                            setStatus('success', data.ap_settings_last_action);
                            loadClients();
                            return;
                        }
                        if (tries >= 20) {
                            clearInterval(timer);
                            document.getElementById('saveBtn').disabled = false;
                            setStatus('error', 'No response from Wi-Fi manager. Please check again.');
                        }
                    })
                    .catch(function() {
                        if (tries >= 20) {
                            clearInterval(timer);
                            document.getElementById('saveBtn').disabled = false;
                            setStatus('error', 'Status request failed.');
                        }
                    });
            }, 500);
        }

        function changeApPassword() {
            var pwd = document.getElementById('apPassword').value || '';
            if (pwd.length < 8 || pwd.length > 63) {
                setStatus('error', 'Password must be 8-63 characters.');
                return;
            }
            document.getElementById('saveBtn').disabled = true;
            setStatus('loading', 'Applying AP password...');
            fetch('/api/ap-settings/password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pwd })
            })
            .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, status: r.status, data: data }; }); })
            .then(function(resp) {
                if (!resp.ok) {
                    document.getElementById('saveBtn').disabled = false;
                    setStatus('error', resp.data.error || ('Request failed (' + resp.status + ')'));
                    return;
                }
                pollResult();
            })
            .catch(function() {
                document.getElementById('saveBtn').disabled = false;
                setStatus('error', 'Request failed.');
            });
        }

        loadClients();
    </script>
</body>
</html>
