<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Password</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 17px; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(180deg, #f2fbfa 0%, #dff2ef 100%); }
        .container { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 420px; width: 94%; }
        .header { display: flex; align-items: center; margin-bottom: 14px; }
        .title { font-size: 1.1em; font-weight: 600; color: #333; }
        .top-switch { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #d9d9dd; padding: 8px 4px 10px 4px; margin-bottom: 12px; }
        .top-switch a { text-decoration: none; color: #202124; width: 44px; height: 44px; border-radius: 50%; border: 2px solid transparent; display: inline-flex; align-items: center; justify-content: center; font-size: 1.45em; }
        .top-switch a.active { border-color: #202124; }
        .top-switch .arrow { color: #20b2aa; font-size: 1.9em; line-height: 1; margin: 0 2px; }
        .card { border: 1px solid #e5e5e7; border-radius: 10px; padding: 14px; }
        .label { color: #555; margin-bottom: 8px; font-size: 0.95em; }
        .row { display: flex; gap: 8px; align-items: center; }
        input[type="password"], input[type="text"] { flex: 1; padding: 10px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 0.95em; outline: none; }
        input:focus { border-color: #20b2aa; }
        .toggle { color: #20b2aa; cursor: pointer; font-size: 0.85em; user-select: none; }
        .btn { margin-top: 10px; width: 100%; padding: 10px 14px; background: linear-gradient(135deg, #20b2aa 0%, #178a83 100%); color: #fff; border: none; border-radius: 6px; font-size: 0.92em; font-weight: 600; cursor: pointer; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .hint { margin-top: 10px; font-size: 0.82em; color: #86868b; }
        .status { margin-top: 12px; padding: 10px; border-radius: 8px; display: none; }
        .status.loading { display: block; background: #e0f7f5; color: #178a83; }
        .status.error { display: block; background: #ffebee; color: #c62828; }
        .status.success { display: block; background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-switch">
            <a href="/settings/device-info" title="Device information">i</a>
            <a href="/wifi-settings" title="WiFi Settings">&#128246;</a>
            <span class="arrow">&rsaquo;</span>
            <a href="/settings/ap-password" class="active" title="AP Password">&#128273;</a>
            <a href="/settings/rexgend-config" title="ReXgen Settings">&#9881;</a>
        </div>
        <div class="header">
            <span class="title">AP Password</span>
        </div>
        <div class="card">
            <div class="label">Change AP password</div>
            <div class="row">
                <input id="apPassword" type="password" placeholder="New AP password (8-63 chars)" autocomplete="new-password">
                <span class="toggle" onclick="togglePwd()">Show</span>
            </div>
            <button id="saveBtn" class="btn" onclick="changeApPassword()">Save Password</button>
            <div class="hint">Changing AP password restarts AP and disconnects connected AP clients.</div>
            <div id="status" class="status"></div>
        </div>
    </div>
    <script>
        function setStatus(type, text) {
            var el = document.getElementById('status');
            el.className = 'status ' + type;
            el.textContent = text;
            el.style.display = 'block';
        }
        function togglePwd() {
            var input = document.getElementById('apPassword');
            var toggle = document.querySelector('.toggle');
            if (input.type === 'password') {
                input.type = 'text';
                toggle.textContent = 'Hide';
            } else {
                input.type = 'password';
                toggle.textContent = 'Show';
            }
        }
        function pollResult() {
            var tries = 0;
            var timer = setInterval(function() {
                tries++;
                fetch('/api/status')
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        if (data.ap_settings_error) {
                            clearInterval(timer);
                            document.getElementById('saveBtn').disabled = false;
                            setStatus('error', data.ap_settings_error);
                            return;
                        }
                        if (data.ap_settings_last_action) {
                            clearInterval(timer);
                            document.getElementById('saveBtn').disabled = false;
                            setStatus('success', data.ap_settings_last_action);
                            return;
                        }
                        if (tries >= 20) {
                            clearInterval(timer);
                            document.getElementById('saveBtn').disabled = false;
                            setStatus('error', 'No response from Wi-Fi manager. Please check again.');
                        }
                    })
                    .catch(function() {
                        if (tries >= 20) {
                            clearInterval(timer);
                            document.getElementById('saveBtn').disabled = false;
                            setStatus('error', 'Status request failed.');
                        }
                    });
            }, 500);
        }
        function changeApPassword() {
            var pwd = document.getElementById('apPassword').value || '';
            if (pwd.length < 8 || pwd.length > 63) {
                setStatus('error', 'Password must be 8-63 characters.');
                return;
            }
            document.getElementById('saveBtn').disabled = true;
            setStatus('loading', 'Applying AP password...');
            fetch('/api/ap-settings/password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pwd })
            })
            .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, status: r.status, data: data }; }); })
            .then(function(resp) {
                if (!resp.ok) {
                    document.getElementById('saveBtn').disabled = false;
                    setStatus('error', resp.data.error || ('Request failed (' + resp.status + ')'));
                    return;
                }
                pollResult();
            })
            .catch(function() {
                document.getElementById('saveBtn').disabled = false;
                setStatus('error', 'Request failed.');
            });
        }
    </script>
</body>
</html>
