<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi Network Info</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 17px; margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(180deg, #f2fbfa 0%, #dff2ef 100%); }
        a { color: #20b2aa; }
        a:hover { color: #5ed8d1; }
        .container { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 640px; width: 94%; }
        .top-switch { display: flex; background: #f5f5f7; border-radius: 16px 16px 0 0; overflow: hidden; margin: -20px -20px 12px -20px; }
        .top-switch a { flex: 1; height: 64px; text-decoration: none; color: #20b2aa; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        .top-switch a.active { background: #fff; color: #178a83; }
        .top-switch svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .top-switch .tab-label { font-size: 0.62em; font-weight: 600; line-height: 1; white-space: nowrap; text-align: center; }
        .detail-header { display: flex; align-items: center; margin-bottom: 14px; }
        .back-btn { font-size: 1.3em; color: #20b2aa; cursor: pointer; margin-right: 10px; text-decoration: none; line-height: 1; }
        .detail-title { font-size: 1.1em; font-weight: 600; color: #333; flex: 1; text-align: center; margin-right: 18px; }
        .detail-subtitle { margin: -8px 0 10px 0; text-align: center; color: #86868b; font-size: 0.85em; word-break: break-word; }
        .detail-signal { display: flex; justify-content: center; align-items: center; margin: 12px 0; gap: 10px; }
        .wifi-bars { display: flex; align-items: flex-end; gap: 3px; height: 24px; }
        .wifi-bars .bar { width: 4px; background: #cfe5e2; border-radius: 2px; }
        .wifi-bars .bar.active { background: #20b2aa; }
        .wifi-bars .bar:nth-child(1) { height: 6px; }
        .wifi-bars .bar:nth-child(2) { height: 10px; }
        .wifi-bars .bar:nth-child(3) { height: 16px; }
        .wifi-bars .bar:nth-child(4) { height: 24px; }
        .signal-text { font-size: 1em; color: #333; }
        .info-table { font-size: 0.95em; }
        .info-row { display: grid; grid-template-columns: auto 1fr; border-bottom: 1px solid #e5e5e7; }
        .info-row:last-child { border-bottom: none; }
        .info-key, .info-val { padding: 10px 12px; }
        .info-key { color: #86868b; white-space: nowrap; }
        .info-val { color: #333; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .error { text-align: center; color: #c62828; padding: 10px; }
    </style>
    <!-- footer-safe-space -->    <style>body { padding-bottom: 64px !important; } .container { margin-top: 36px; }</style>
</head>
<body>
    <div class="container">
    {% include '_topnav.html' %}
    <div class="detail-header">
        <a class="back-btn" href="/wifi-settings">&larr;</a>
        <span class="detail-title">Wi-Fi Settings</span>
    </div>
    <div id="ssidTitle" class="detail-subtitle">Loading...</div>
    <div class="detail-signal">
        <div id="signalBars" class="wifi-bars">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <span id="signalText" class="signal-text">--</span>
    </div>
    <div id="error" class="error" style="display:none;"></div>
    <div id="table" class="info-table"></div>
    </div>
    <script>
    function q(name) { return new URLSearchParams(location.search).get(name) || ''; }
    function esc(s) { return String(s || '').replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
    function freqInfo(freq) {
        var f = parseInt(freq, 10);
        if (!f) return { band: '--', tech: '--', channel: '--' };
        if (f >= 2400 && f <= 2500) { var ch24 = Math.round((f - 2407) / 5); if (f === 2484) ch24 = 14; return { band: '2.4 GHz', tech: 'WiFi 4 (802.11n)', channel: ch24 }; }
        if (f >= 5000 && f <= 5900) { return { band: '5 GHz', tech: 'WiFi 5 (802.11ac)', channel: Math.round((f - 5000) / 5) }; }
        if (f >= 5925 && f <= 7125) { return { band: '6 GHz', tech: 'WiFi 6E (802.11ax)', channel: Math.round((f - 5950) / 5) }; }
        return { band: '--', tech: '--', channel: '--' };
    }
    function parseSecurity(flags) {
        var f = String(flags || '');
        if (f.indexOf('WPA3') >= 0 || f.indexOf('SAE') >= 0) return 'WPA3';
        if (f.indexOf('WPA2') >= 0 || f.indexOf('RSN') >= 0) return 'WPA2';
        if (f.indexOf('WPA') >= 0) return 'WPA';
        if (f.indexOf('WEP') >= 0) return 'WEP';
        return 'Open';
    }
    function signalBars(dbm) {
        if (dbm >= -50) return 4;
        if (dbm >= -60) return 3;
        if (dbm >= -70) return 2;
        if (dbm >= -80) return 1;
        return 0;
    }
    function signalLabel(dbm) {
        if (dbm >= -50) return 'Excellent';
        if (dbm >= -60) return 'Good';
        if (dbm >= -70) return 'Fair';
        if (dbm >= -80) return 'Weak';
        return 'Very weak';
    }
    function renderBars(dbm) {
        var count = signalBars(dbm);
        var bars = document.querySelectorAll('#signalBars .bar');
        bars.forEach(function(el, idx) {
            if (idx < count) el.classList.add('active');
            else el.classList.remove('active');
        });
        document.getElementById('signalText').textContent = signalLabel(dbm);
    }
    function findBySsid(nets, ssid) { return (nets || []).find(function(n){ return (typeof n === 'object' ? n.ssid : n) === ssid; }); }
    var ssid = q('ssid');
    document.getElementById('ssidTitle').textContent = ssid || 'Unknown SSID';
    if (!ssid) {
        document.getElementById('error').textContent = 'SSID is missing';
        document.getElementById('error').style.display = 'block';
    } else {
        Promise.all([fetch('/api/status').then(function(r){ return r.json(); }), fetch('/api/networks').then(function(r){ return r.json(); })])
            .then(function(all) {
                var st = all[0] || {};
                var payload = all[1] || {};
                var net = findBySsid(payload.networks, ssid);
                if (!net) {
                    document.getElementById('error').textContent = 'Network not found in current scan';
                    document.getElementById('error').style.display = 'block';
                    return;
                }
                var isConn = (st.connected_ssid === ssid);
                var known = payload.known || [];
                var fi = freqInfo(net.frequency || '');
                renderBars(parseInt(net.signal || -100, 10));
                var rows = [];
                rows.push(['Status', isConn ? 'Connected' : 'Not connected']);
                rows.push(['Saved', known.indexOf(ssid) >= 0 ? 'Yes' : 'No']);
                if (isConn && st.client_ip) rows.push(['IP Address', st.client_ip]);
                if (isConn && st.client_mac) rows.push(['MAC Address', String(st.client_mac).toUpperCase()]);
                rows.push(['Signal', String(net.signal || '--') + ' dBm']);
                rows.push(['Security', parseSecurity(net.flags || '')]);
                rows.push(['Technology', fi.tech]);
                rows.push(['Band', fi.band]);
                rows.push(['Channel', fi.channel]);
                if (net.bssid) rows.push(['BSSID', String(net.bssid).toUpperCase()]);
                if (net.frequency) rows.push(['Frequency', String(net.frequency) + ' MHz']);
                if (net.flags) rows.push(['Raw Flags', String(net.flags)]);
                var html = '';
                rows.forEach(function(r){ html += '<div class="info-row"><div class="info-key">' + esc(r[0]) + '</div><div class="info-val">' + esc(r[1]) + '</div></div>'; });
                document.getElementById('table').innerHTML = html;
            })
            .catch(function() {
                document.getElementById('error').textContent = 'Failed to load network details';
                document.getElementById('error').style.display = 'block';
            });
    }

</script>
    {% include '_footer.html' %}
</body>
</html>
